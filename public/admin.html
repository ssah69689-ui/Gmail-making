<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Grid Control - Secure Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #030712; color: #f9fafb; min-height: 100vh; padding: 30px; }
        .lock-container { max-width: 360px; margin: 100px auto; background: #111827; border: 1px solid #ef4444; border-radius: 12px; padding: 30px; text-align: center; box-shadow: 0 0 30px rgba(239,68,68,0.2); }
        .dashboard-layout { display: none; max-width: 1200px; margin: 0 auto; grid-template-columns: 1fr 2fr; gap: 30px; }
        .box { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 20px; }
        .input-field { width:100%; background:#1f2937; border:1px solid #374151; padding:10px; color:white; border-radius:6px; margin-bottom:12px; outline:none; }
        .btn { width:100%; background:#ef4444; color:white; font-weight:bold; border:none; padding:10px; border-radius:6px; cursor:pointer; }
    </style>
</head>
<body>

    <!-- SECURE INTERCEPT GATEWAY LOGIN -->
    <div id="lockGate" class="lock-container">
        <h3 style="color:#ef4444; margin-bottom:5px;">🔒 Cyber Gate Shield</h3>
        <p style="font-size:12px; color:#9ca3af; margin-bottom:20px;">Unauthorized Entry is Strictly Logged</p>
        <input type="text" id="admUser" placeholder="Enter Master Username" class="input-field">
        <input type="password" id="admPass" placeholder="Enter Security Code" class="input-field">
        <button class="btn" onclick="verifyGate()">Verify Identity</button>
    </div>

    <!-- MAIN CORE SECURE GRID INTERFACE -->
    <div id="adminGrid" class="dashboard-layout">
        <div style="display:flex; flex-direction:column; gap:20px;">
            <div class="box">
                <h4 style="color:#9ca3af; font-size:12px; text-transform:uppercase; margin-bottom:12px;">👑 Register System Sub-Admin</h4>
                <input type="text" id="newSubName" placeholder="Admin Nickname" class="input-field">
                <input type="password" id="newSubPass" placeholder="Secret Key Token" class="input-field">
                <button class="btn" style="background:#2563eb;" onclick="addSubAdmin()">Authorize Access Node</button>
            </div>
            <div class="box">
                <h4 style="color:#9ca3af; font-size:12px; text-transform:uppercase; margin-bottom:12px;">📡 Main Owner System Audit Notifications</h4>
                <div id="notifyBox" style="font-size:11px; color:#9ca3af; line-height:1.6;">Awaiting secure loop stream setup...</div>
            </div>
        </div>

        <div class="box">
            <h4 style="color:#9ca3af; font-size:12px; text-transform:uppercase; margin-bottom:15px;">💸 Multi-Admin User Balance Control Desk</h4>
            <div style="margin-bottom:15px; display:flex; gap:10px;">
                <input type="text" id="targetUser" placeholder="Target User Telegram Name" class="input-field" style="margin:0;">
                <input type="number" id="targetAmt" placeholder="₹ Amount" class="input-field" style="margin:0; width:100px;">
                <button class="btn" style="background:#22c55e; width:auto; padding:0 20px;" onclick="adjustBalance('credit')">Add</button>
                <button class="btn" style="background:#d97706; width:auto; padding:0 20px;" onclick="adjustBalance('debit')">Debit</button>
            </div>
        </div>
    </div>

    <script>
        let loggedAdmin = "";
        async function verifyGate() {
            const username = document.getElementById('admUser').value;
            const password = document.getElementById('admPass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(data.success) {
                loggedAdmin = username;
                document.getElementById('lockGate').style.display = 'none';
                document.getElementById('adminGrid').style.display = 'grid';
                loadLogs();
            } else { alert("ACCESS DENIED: Credentials Invalid."); }
        }
        async function adjustBalance(action) {
            const username = document.getElementById('targetUser').value;
            const amount = document.getElementById('targetAmt').value;
            if(!username || !amount) return alert("Saari fields bhariye!");
            await fetch('/api/admin/update-balance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, amount, action, adminName: loggedAdmin })
            });
            alert("Database balance updated successfully!");
            document.getElementById('targetUser').value=''; document.getElementById('targetAmt').value='';
            loadLogs();
        }
        async function addSubAdmin() {
            const username = document.getElementById('newSubName').value;
            const password = document.getElementById('newSubPass').value;
            if(!username || !password) return alert("Admins fields empty!");
            await fetch('/api/admin/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            alert("Naya Admin Authorized Node register ho gaya!");
            document.getElementById('newSubName').value=''; document.getElementById('newSubPass').value='';
            loadLogs();
        }
        async function loadLogs() {
            const res = await fetch('/api/owner/notifications');
            const data = await res.json();
            const box = document.getElementById('notifyBox');
            if(data.length === 0) { box.innerHTML = "No active sub-admin activity logged."; return; }
            box.innerHTML = data.map(l => `<div style="border-bottom:1px solid #1f2937; padding:4px 0;"><span style="color:#ef4444;">[${l.time}]</span> ${l.details}</div>`).join('');
        }
    </script>
</body>
</html>
